# Two things live here.
#
#   poc                  the Phase 1 proof of concept. Unchanged, still runs
#                        with the network switched off.
#   gateway + nginx      the Phase 2 gateway. Starts in mock mode, so it
#                        needs no API key and no internet.
#
# qdrant and redis stay behind the phase2 profile until Week 3 actually uses
# them, so a plain `docker compose up` does not start what nothing talks to.
services:
  poc:
    build: .
    image: sentrygate-poc
    container_name: sentrygate-poc
    # No network: proves the demo has no hidden internet dependency.
    network_mode: none
    # Override args at run time:  docker compose run --rm poc --fast
    # command: ["--fast"]

  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile.gateway
      args:
        BUILD_SHA: "${BUILD_SHA:-unknown}"
    image: sentrygate-gateway
    container_name: sentrygate-gateway
    environment:
      # Every value below has a safe default, so this runs on a fresh clone
      # with no .env file at all. Compose reads .env if it is there.
      PROVIDER_MODE: "${PROVIDER_MODE:-mock}"
      PROVIDER_RECORD: "${PROVIDER_RECORD:-off}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      DEFAULT_MODEL: "${DEFAULT_MODEL:-gpt-4o-mini}"
      SPEND_CAP_USD_PER_DAY: "${SPEND_CAP_USD_PER_DAY:-2.0}"
      # The experiment switches. Phase 2 is the vulnerable baseline.
      PIPELINE_ORDER: "${PIPELINE_ORDER:-cache_first}"
      CACHE_VERDICT_FILTER: "${CACHE_VERDICT_FILTER:-off}"
      CACHE_REVERIFY_HIGH_RISK: "${CACHE_REVERIFY_HIGH_RISK:-off}"
      ROUTER_MODE: "${ROUTER_MODE:-fixed}"
      SIM_THRESHOLD: "${SIM_THRESHOLD:-0.85}"
      INJECTION_THRESHOLD: "${INJECTION_THRESHOLD:-0.5}"
      SCREENING_SCORER: "${SCREENING_SCORER:-auto}"
      EMBED_MODEL: "${EMBED_MODEL:-all-MiniLM-L6-v2}"
      CACHE_EMBEDDER: "${CACHE_EMBEDDER:-auto}"
      CACHE_BACKEND: "${CACHE_BACKEND:-auto}"
      # Test-only. Week 4 plants its poisoned entries through this.
      ALLOW_CACHE_SEED: "${ALLOW_CACHE_SEED:-off}"
      # Each experiment run writes its own log file under data/.
      LOG_FILE: "${LOG_FILE:-requests.jsonl}"
      QDRANT_URL: "${QDRANT_URL:-http://qdrant:6333}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
    # The request log, the cassettes and the spend ledger live here, so they
    # survive a restart and can be read from the host without docker cp.
    # data/ holds the log, cassettes and ledger. hf_models holds downloaded
    # model weights, so they survive restarts instead of downloading again.
    volumes: ["./data:/data", "hf_models:/models"]
    # Direct port for debugging. Normal traffic goes through nginx on 8080.
    ports: ["8000:8000"]

  nginx:
    image: nginx:1.27-alpine
    container_name: sentrygate-nginx
    volumes: ["./deploy/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8080:80"]
    depends_on:
      gateway:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: sentrygate-qdrant
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]
    profiles: ["phase2"]

  redis:
    image: redis:7-alpine
    container_name: sentrygate-redis
    # Host port is only for debugging with redis-cli; the gateway talks to
    # redis over the compose network. Change it if 6379 is already taken.
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"]
    command: ["redis-server", "--save", "60", "1"]
    volumes: ["redis_data:/data"]
    profiles: ["phase2"]

volumes:
  qdrant_data:
  redis_data:
  hf_models:
