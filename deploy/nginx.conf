# Nginx sits in front of the gateway, as it would in a real deployment.
# It does nothing clever. It is here so the request path in the paper matches
# the request path in the code, and so TLS has somewhere to live later.

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    upstream gateway {
        server gateway:8000;
    }

    server {
        listen 80;

        # Model replies can be slow. A short timeout here would look like a
        # gateway bug and waste an afternoon.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Prompts can be long, and Week 4 sends generated attack variants.
        client_max_body_size 2m;

        location / {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Keep the caller's request id if they set one, so a client can
            # find its own request in our log.
            proxy_set_header X-Request-Id $http_x_request_id;
        }
    }
}
